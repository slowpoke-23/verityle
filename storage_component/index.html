<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
// Minimal Streamlit component: keeps one value in the browser's localStorage.
//  - On first render it reports whatever is stored back to Python.
//  - Whenever Python passes a "save" value, it writes it to localStorage.
(function () {
    var KEY = "verityle:daily";
    var reported = false;

    function send(type, data) {
        var msg = { isStreamlitMessage: true, type: type };
        for (var k in data) msg[k] = data[k];
        window.parent.postMessage(msg, "*");
    }

    function readStored() {
        try {
            var raw = window.localStorage.getItem(KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        var args = event.data.args || {};

        // Read first, so a save can never wipe what we are about to report.
        if (!reported) {
            reported = true;
            send("streamlit:setComponentValue", {
                value: { stored: readStored() },
                dataType: "json"
            });
        }

        if (args.save !== null && args.save !== undefined) {
            try {
                window.localStorage.setItem(KEY, JSON.stringify(args.save));
            } catch (e) {}
        }
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
</body>
</html>
